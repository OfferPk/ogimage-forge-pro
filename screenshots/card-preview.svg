<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.03em; line-height: 1.15; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
      .brand-text { font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
      .meta-text { font-family: -apple-system, sans-serif; font-size: 17px; font-weight: 600; fill: #94a3b8; }
    </style>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111a2e" />
      <stop offset="100%" stop-color="#1e112e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#cyberGrad)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Header -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect width="170" height="34" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#0284c7" stroke-width="1" />
    <text x="85" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1px" text-anchor="middle">PRODUCT LAUNCH</text>
    <!-- Brand -->
    <text x="1040" y="23" class="brand-text" text-anchor="end">AgentFlow.io</text>
  </g>

  <!-- Main Headline -->
  <foreignObject x="80" y="150" width="1040" height="180">
    <div xmlns="http://www.w3.org/1999/xhtml" class="title-text">
      Introducing AgentFlow 2.0: Autonomous Workflow Orchestration
    </div>
  </foreignObject>

  <!-- Description -->
  <foreignObject x="80" y="340" width="1040" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" class="desc-text">
      Deploy self-healing multi-agent pipelines with sub-second execution, distributed memory caching, and zero cloud lock-in.
    </div>
  </foreignObject>

  <!-- Tag Pills -->
  <g transform="translate(80, 475)">
    <rect width="110" height="32" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="55" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AI Agents</text>
  </g>
  <g transform="translate(202, 475)">
    <rect width="90" height="32" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="45" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python</text>
  </g>
  <g transform="translate(304, 475)">
    <rect width="115" height="32" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="57" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Workflows</text>
  </g>
  <g transform="translate(431, 475)">
    <rect width="130" height="32" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="65" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Automation</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 560)">
    <circle cx="10" cy="-5" r="12" fill="#38bdf8" />
    <text x="32" y="0" class="meta-text">Sarah Jenkins • Founder &amp; CEO</text>
    <text x="1040" y="0" class="meta-text" text-anchor="end">v2.0 Release Notes</text>
  </g>
</svg>
